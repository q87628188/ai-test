spring:
  application:
    name: rag-doc-async-ingest
  datasource:
    url: jdbc:h2:file:./data/tasks;AUTO_SERVER=TRUE;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080
